name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ESSA LINHA É O SEGREDO
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: pedromarq40
          template: classic
          base: header, community, repositories, metadata
          filename: github-metrics.svg
          # Se quiser excluir os cursos, use a linha abaixo:
          repositories_skipped: AprendendoJava, CSI
