name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Atualiza todo dia à meia-noite
  workflow_dispatch: # Permite rodar manualmente
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: pedromarq40
          template: classic
          base: header, community, repositories, metadata
          # Adicione abaixo os repositórios que deseja excluir
          repositories_skipped: AprendendoJava, CSI
