name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: pedromarq40
          template: classic
          base: header, community, repositories, metadata
          filename: github-metrics.svg
          
          # Configuração das Linguagens (Lado direito)
          plugin_languages: yes
          plugin_languages_ignored: html, css # Opcional: ignore linguagens simples
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          
          # Filtros de repositórios
          repositories_skipped: AprendendoJava, CSI
